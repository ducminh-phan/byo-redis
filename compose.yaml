services:
  server:
    build: .
    container_name: byo-redis-server
    command:
      - "--bind"
      - "0.0.0.0"
      - "--metrics-bind"
      - "0.0.0.0"

  client:
    image: redis
    container_name: byo-redis-client
    command: sleep infinity
    depends_on:
      server:
        condition: service_started

  prometheus:
    image: prom/prometheus
    container_name: byo-redis-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
