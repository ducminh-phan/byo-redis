[package]
name = "byo-redis"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "byo-redis-server"
path = "src/bin/server.rs"

[dependencies]
atoi = "3"
bytes = "1"
clap = { version = "4", features = ["derive"] }
enum_dispatch = "0.3"
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
metrics-process = "2"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
redis = { version = "1", features = ["tokio-comp"] }
